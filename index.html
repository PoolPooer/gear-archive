<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1"
  />

  <title>Paul's Gear Archive</title>

  <link
    rel="stylesheet"
    href="styles.css?v=7"
  />
</head>

<body>
  <a class="skip-link" href="#collectionView">Skip to collection</a>
  <main class="shell">

    <header class="site-header">
      <div>
        <p class="eyebrow">
          Personal archive
        </p>

        <h1>
          Gear archive
        </h1>

        <p class="lede">
          Paul’s collection
        </p>
      </div>

      <nav
        class="filters"
        aria-label="Gear categories"
      >
        <button
          class="filter active"
          aria-pressed="true" data-filter="all"
          type="button"
        >
          All
        </button>

        <button
          class="filter"
          aria-pressed="false" data-filter="guitar"
          type="button"
        >
          Guitars
        </button>

        <button
          class="filter"
          aria-pressed="false" data-filter="acoustic"
          type="button"
        >
          Acoustics
        </button>

        <button
          class="filter"
          aria-pressed="false" data-filter="bass"
          type="button"
        >
          Bass
        </button>

        <button
          class="filter"
          aria-pressed="false" data-filter="amp"
          type="button"
        >
          Amps
        </button>

        <button
          class="filter"
          aria-pressed="false" data-filter="pedal"
          type="button"
        >
          Pedals
        </button>

        <button
          class="filter"
          aria-pressed="false" data-filter="microphone"
          type="button"
        >
          Microphones
        </button>

        <button
          class="filter"
          aria-pressed="false" data-filter="recording"
          type="button"
        >
          Recording
        </button>

        <button
          class="filter"
          aria-pressed="false" data-filter="accessory"
          type="button"
        >
          Accessories
        </button>
      </nav>
    </header>


    <section id="collectionView" tabindex="-1" aria-label="Collection">

      <div
        class="archive-summary"
        id="stats"
      ></div>


      <div class="collection-toolbar">

        <div class="collection-search">
          <label
            class="sr-only"
            for="collectionSearch"
          >
            Search collection
          </label>

          <input
            id="collectionSearch"
            type="search"
            placeholder="Search the archive…"
            autocomplete="off"
          />
        </div>


        <div class="collection-controls">

          <label
            class="sr-only"
            for="collectionStatus"
          >
            Ownership status
          </label>

          <select id="collectionStatus">
            <option value="all">
              All gear
            </option>

            <option value="owned">
              Owned
            </option>

            <option value="past">
              Past gear
            </option>
          </select>


          <label
            class="sr-only"
            for="collectionSort"
          >
            Sort collection
          </label>

          <select id="collectionSort">
             <option value="acquired-desc">
                      Newest first
             </option>

             <option value="acquired-asc">
                      Oldest first
            </option>

             <option value="brand-asc">
                      Brand A–Z
             </option>
          </select>

        </div>
      </div>


      <div class="section-heading">
        <h2>
          Collection
        </h2>

        <span id="collectionCount" role="status" aria-live="polite"></span>
      </div>


      <div
        id="gearList"
        class="gear-list"
      ></div>

    </section>


    <section
      id="detailView"
      class="hidden"
    ></section>

  </main>


  <script src="data.js?v=3"></script>
  <script src="script.js?v=7"></script>
</body>
</html>
